version: "3.9"

# ── Production stack ───────────────────────────────────────────────────────────
# Usage: docker compose -f docker-compose.prod.yml up -d
# Expects: .env.production file (or env vars injected by your host)
# External services: Supabase (Postgres, DATABASE_URL in backend/.env) + Cloudflare R2 (media). Redis runs here (haip_redis).

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haip_api
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      whatsapp-bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haip_worker
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - ENVIRONMENT=production
      # concurrency=2 doesn't need the API's full 15-connection pool budget.
      - DB_POOL_SIZE=3
      - DB_MAX_OVERFLOW=3
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=2
      --queues=transcription,ai_scoring,whatsapp,call_ingest,default
    volumes:
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  # Competitor collector (Marketing Studio plan phase 2): OFF unless started with
  # `docker compose --profile research up -d research_collector`. Logged out, public data only, egress through
  # RESEARCH_PROXY_URL; never uses a tenant's Instagram/Facebook token or HAIP's Meta app. Consumes research_collect only.
  research_collector:
    profiles: ["research"]
    build:
      context: ./backend
      dockerfile: Dockerfile.collector
    container_name: haip_research_collector
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - ENVIRONMENT=production
      - DB_POOL_SIZE=1
      - DB_MAX_OVERFLOW=1
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Use a relative path so the browser always calls the same origin it's on.
        # This eliminates CORS entirely — www.genhaip.com, genhaip.com, or any domain
        # will work without cross-origin issues. The Next.js proxy rewrites
        # /api/v1/* → http://haip_api:8000/api/v1/* at runtime.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
        - NEXTAUTH_URL=${NEXTAUTH_URL:-https://genhaip.com}
    container_name: haip_frontend
    restart: unless-stopped
    env_file: ./frontend/.env.local
    environment:
      # BACKEND_URL is a runtime (server-side) var — Next.js proxy rewrites use it
      # to forward /api/v1/* to the FastAPI container. Must be the Docker service name.
      - BACKEND_URL=${BACKEND_URL:-http://haip_api:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Client websites (website builder): every hostname that is not the HAIP app is a client site. nginx (host)
  # sends *.SITES_BASE_DOMAIN and verified custom domains here; see docs/website-builder/DEPLOY.md.
  sites:
    build:
      context: .
      dockerfile: sites/Dockerfile
    container_name: haip_sites
    restart: unless-stopped
    environment:
      - HAIP_API_URL=${HAIP_API_URL:-http://haip_api:8000}
      - SITES_REVALIDATE_SECRET=${SITES_REVALIDATE_SECRET:-}
    ports:
      - "127.0.0.1:3020:3020"
    mem_limit: 512m
    depends_on:
      - api
  whatsapp-bridge:
    build:
      context: ./bridge/whatsapp-personal
      dockerfile: Dockerfile
    container_name: haip_whatsapp_bridge
    restart: unless-stopped
    environment:
      # Personal/Business-app WhatsApp bridge (whatsmeow, unofficial --
      # Phase 1 read-only capture only). Plain `postgres://` DSN, same
      # host/credentials as DATABASE_URL but WITHOUT a SQLAlchemy dialect
      # suffix (+psycopg2 etc.) -- lib/pq needs the bare scheme.
      - BRIDGE_DB_DSN=${WHATSAPP_BRIDGE_DB_DSN}
      - HTTP_PORT=8085
      # Optional -- SOCKS5 (or HTTP) proxy URL, e.g. socks5://user:pass@host:port.
      # Routes whatsmeow's WhatsApp connection through it instead of connecting
      # directly from this VPS. Empty (unset) = no change from today.
      - WHATSAPP_PROXY_URL=${WHATSAPP_PROXY_URL:-}
    # Not exposed externally -- only the api container calls this, over
    # the compose network, matching WHATSAPP_BRIDGE_URL's default in
    # backend/app/core/config.py.
    healthcheck:
      # Distroless runtime image has no shell/wget -- re-invokes the same
      # static binary with its own self-check mode instead.
      test: ["CMD", "/bridge", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: haip_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haip_beat
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - ENVIRONMENT=production
      # Beat only ever needs one connection at a time to check the schedule.
      - DB_POOL_SIZE=1
      - DB_MAX_OVERFLOW=1
    command: >
      celery -A app.workers.celery_app beat
      --loglevel=info
      --scheduler celery.beat.PersistentScheduler
    volumes:
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haip_flower
    restart: unless-stopped
    env_file: ./backend/.env
    # Bind to localhost only — not exposed to internet without a reverse proxy + auth
    command: >
      celery -A app.workers.celery_app flower
      --port=5555
      --address=127.0.0.1
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis
    healthcheck:
      # The base image's HEALTHCHECK probes :8000 (the FastAPI app) — wrong
      # port for this service, which only ever listens on :5555. Without this
      # override Docker reports the container "unhealthy" forever even when
      # Flower itself is fine, same as worker/beat above.
      disable: true

volumes:
  uploads:
  redis_data:
