[mypy]
# SQLAlchemy's mypy plugin reads the old-style Column(...) models (without it every model attribute is a Column, not a
# value: 287 errors in the ops files alone). It is deprecated and gone in SQLAlchemy 2.1; drop it when the models move to
# Mapped[...] annotations. CI runs mypy on files a branch adds, report-only (.github/workflows/lint.yml).
plugins = sqlalchemy.ext.mypy.plugin
ignore_missing_imports = True
no_strict_optional = True
