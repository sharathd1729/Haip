[deploy]
# Railway will call /health every 30s.
# If it returns non-2xx for 3 consecutive checks, Railway restarts the container.
healthcheckPath = "/health"
healthcheckTimeout = 10

# Give the app 60s to boot (DB migrations, model registration)
startCommand = "gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:$PORT --timeout 120 --graceful-timeout 30"

# Restart policy: always restart on crash, back off to avoid thrash
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
