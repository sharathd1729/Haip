name: Deploy — Staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  build-backend:
    name: Build & push backend image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/haip-backend:$IMAGE_TAG ./backend
          docker push $ECR_REGISTRY/haip-backend:$IMAGE_TAG
          docker tag  $ECR_REGISTRY/haip-backend:$IMAGE_TAG \
                      $ECR_REGISTRY/haip-backend:staging-latest
          docker push $ECR_REGISTRY/haip-backend:staging-latest

  build-frontend:
    name: Build & push frontend image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL \
            -t $ECR_REGISTRY/haip-frontend:$IMAGE_TAG \
            ./frontend
          docker push $ECR_REGISTRY/haip-frontend:$IMAGE_TAG
          docker tag  $ECR_REGISTRY/haip-frontend:$IMAGE_TAG \
                      $ECR_REGISTRY/haip-frontend:staging-latest
          docker push $ECR_REGISTRY/haip-frontend:staging-latest

  deploy:
    name: Deploy to staging ECS
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Run DB migrations (via ECS task)
        run: |
          aws ecs run-task \
            --cluster haip-staging \
            --task-definition haip-migrate \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.STAGING_SUBNET }}],securityGroups=[${{ secrets.STAGING_SG }}],assignPublicIp=ENABLED}" \
            --wait

      - name: Deploy backend service
        run: |
          aws ecs update-service \
            --cluster haip-staging \
            --service haip-backend \
            --force-new-deployment \
            --region ap-south-1

      - name: Deploy frontend service
        run: |
          aws ecs update-service \
            --cluster haip-staging \
            --service haip-frontend \
            --force-new-deployment \
            --region ap-south-1

      - name: Wait for services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster haip-staging \
            --services haip-backend haip-frontend

      # ── B17: Sentry release tagging ──────────────────────────────────────────
      - name: Create Sentry release
        if: success()
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG:        ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT:    ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: staging
          version:     ${{ github.sha }}

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "*Staging deploy ${{ job.status }}* — <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>  by ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
